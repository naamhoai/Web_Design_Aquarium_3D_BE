services:
  # ----------------------------------------------------------------------------
  # 1. POSTGRESQL DATABASE (Optional containerized parity on 5433)
  # Native PostgreSQL 18 is running on port 5432
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aquarium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquarium_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-276204}
    ports:
      - "${POSTGRES_DOCKER_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infrastructure/postgres/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    networks:
      - aquarium-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aquarium_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. REDIS CACHE & DISTRIBUTED LOCK
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aquarium-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aquarium-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. APACHE KAFKA (KRaft Mode - Modern, No Zookeeper required)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aquarium-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aquarium-network

  # ----------------------------------------------------------------------------
  # 4. KAFKA UI (Web Dashboard to inspect Topics, Consumer Groups & Messages)
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aquarium-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aquarium-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - aquarium-network

  # ----------------------------------------------------------------------------
  # 5. MINIO S3-COMPATIBLE OBJECT STORAGE (From official Quay.io registry)
  # ----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: aquarium-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Console dashboard
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - aquarium-network

  minio-create-buckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/aquarium-3d-assets;
      /usr/bin/mc mb myminio/aquarium-products;
      /usr/bin/mc mb myminio/aquarium-doa-claims;
      /usr/bin/mc anonymous set download myminio/aquarium-3d-assets;
      /usr/bin/mc anonymous set download myminio/aquarium-products;
      exit 0;
      "
    networks:
      - aquarium-network

networks:
  aquarium-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
