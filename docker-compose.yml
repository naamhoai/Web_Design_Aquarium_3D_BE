# Hạ tầng tùy chọn cho môi trường dev.
# - Mọi mật khẩu BẮT BUỘC đặt trong file .env (xem .env.example) — không còn giá trị mặc định trong mã nguồn.
# - Mọi cổng chỉ mở trên 127.0.0.1 để máy khác trong mạng LAN không truy cập được.
services:
  # ----------------------------------------------------------------------------
  # 1. POSTGRESQL DATABASE (Optional containerized parity on 5433)
  # Native PostgreSQL is running on port 5432
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aquarium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquarium_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_DOCKER_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./database/03_security_and_configurator.sql:/docker-entrypoint-initdb.d/03_security_and_configurator.sql:ro
    networks:
      - aquarium-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aquarium_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. REDIS CACHE & DISTRIBUTED LOCK
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aquarium-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      # redis-cli đọc mật khẩu từ biến này => healthcheck không lộ mật khẩu trong tham số dòng lệnh
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aquarium-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. APACHE KAFKA (KRaft Mode - Modern, No Zookeeper required)
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aquarium-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - aquarium-network

  # ----------------------------------------------------------------------------
  # 4. KAFKA UI (không có đăng nhập => chỉ mở trên localhost)
  # ----------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aquarium-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aquarium-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - aquarium-network

  # ----------------------------------------------------------------------------
  # 5. MINIO S3-COMPATIBLE OBJECT STORAGE
  # ----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: aquarium-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000" # S3 API endpoint
      - "127.0.0.1:9001:9001" # Web Console dashboard
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - aquarium-network

  minio-create-buckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      /usr/bin/mc mb --ignore-existing myminio/aquarium-3d-assets;
      /usr/bin/mc mb --ignore-existing myminio/aquarium-products;
      /usr/bin/mc mb --ignore-existing myminio/aquarium-doa-claims;
      /usr/bin/mc anonymous set download myminio/aquarium-3d-assets;
      /usr/bin/mc anonymous set download myminio/aquarium-products;
      exit 0;
      "
    networks:
      - aquarium-network

networks:
  aquarium-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
