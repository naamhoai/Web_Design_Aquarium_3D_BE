server:
  port: 8081
  # Chỉ lắng nghe trên localhost: client phải đi qua API Gateway (:8080)
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aquarium_db}
    username: ${POSTGRES_USER:postgres}
    # Không có giá trị mặc định: bắt buộc đặt biến môi trường POSTGRES_PASSWORD (xem .env.example)
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

jwt:
  # Bắt buộc: chuỗi ngẫu nhiên >= 32 ký tự, giống nhau ở mọi service. Không commit giá trị thật.
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TTL:7d}

auth:
  refresh-cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

aquarium:
  security:
    public-endpoints:
      - POST /api/v1/auth/register
      - POST /api/v1/auth/login
      - POST /api/v1/auth/refresh
      - POST /api/v1/auth/logout
    max-request-bytes: 16384

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
