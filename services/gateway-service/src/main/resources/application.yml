server:
  port: 8080
  # Mặc định chỉ nhận kết nối từ máy local. Đổi thành 0.0.0.0 khi triển khai sau reverse proxy HTTPS.
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Chỉ cho phép đúng origin của frontend (không dùng wildcard khi allowCredentials=true)
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Aquarium-Client
            exposedHeaders:
              - Retry-After
            allowCredentials: true
            maxAge: 3600

      httpclient:
        # Service phía sau bị treo sẽ không giữ kết nối của gateway mãi (chống cạn tài nguyên)
        connect-timeout: 3000
        response-timeout: 30s
        pool:
          # Đóng kết nối rảnh sớm hơn keep-alive của Tomcat phía sau, tránh lỗi 500
          # "Connection prematurely closed BEFORE response" khi tái dùng kết nối vừa bị đóng
          max-idle-time: 10s
          max-life-time: 5m
          eviction-interval: 5s

      default-filters:
        # Phòng thủ nhiều lớp: nếu service phía sau cũng thêm header CORS thì chỉ giữ 1 giá trị
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        # Chặn body quá lớn ngay tại cổng
        - name: RequestSize
          args:
            maxSize: 2MB

      routes:
        # 1. Identity Service (Auth, JWT, hồ sơ & sổ địa chỉ)
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/account/**

        # 2. Supplier & Warehouse Service
        - id: supplier-service
          uri: ${SUPPLIER_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/suppliers/**, /api/v1/warehouses/**

        # 3. Catalog Service (Products, Categories, Search, 3D-Combos)
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**

        # 4. Aquarium 3D Service (BOM Exploded View, Biology Engine, 3D Designs)
        - id: aquarium-3d-service
          uri: ${AQUARIUM3D_SERVICE_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/3d/**

        # 5. Inventory Service
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8085}
          predicates:
            - Path=/api/v1/inventory/**

        # 6. Order & Cart Service (kể cả đơn hàng con của nhà cung cấp)
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8086}
          predicates:
            - Path=/api/v1/orders/**, /api/v1/cart/**, /api/v1/sub-orders/**

aquarium:
  gateway:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Giới hạn chung cho mọi API theo IP
      default-limit: ${RATE_LIMIT_DEFAULT:300}
      default-window: 60s
      # Giới hạn chặt hơn cho các endpoint xác thực (chống dò mật khẩu / spam đăng ký)
      auth-limit: ${RATE_LIMIT_AUTH:20}
      auth-window: 60s
      auth-paths:
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/auth/refresh
        - /api/v1/account/password
      # Chỉ bật khi gateway đứng sau reverse proxy tin cậy (nginx...) có thêm X-Forwarded-For
      trust-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
