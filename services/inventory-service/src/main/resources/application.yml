server:
  port: 8085
  # Chỉ lắng nghe trên localhost: client phải đi qua API Gateway (:8080)
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  servlet:
    context-path: /

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aquarium_db}
    username: ${POSTGRES_USER:postgres}
    # Không có giá trị mặc định: bắt buộc đặt biến môi trường POSTGRES_PASSWORD (xem .env.example)
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

aquarium:
  security:
    # Khách hàng được xem tồn kho theo sản phẩm (U11); mọi thao tác khác cần đăng nhập + đúng quyền
    public-endpoints:
      - GET /api/v1/inventory/variants/**
    max-request-bytes: 16384

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
